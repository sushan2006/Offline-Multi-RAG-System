<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Upload — RAG Assistant</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .upload-icon {
      font-size: 52px;
      display: inline-block;
      animation: floatIcon 3s ease-in-out infinite;
      margin-bottom: 14px;
    }

    @keyframes floatIcon {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-10px);
      }
    }

    #file {
      display: none;
    }

    .file-selected {
      display: inline-block;
      margin-top: 12px;
      padding: 7px 14px;
      background: rgba(168, 85, 247, 0.15);
      border: 1px solid rgba(168, 85, 247, 0.35);
      border-radius: 8px;
      color: #c084fc;
      font-size: 13px;
      font-weight: 600;
    }

    .panel-title {
      font-family: 'Sora', sans-serif;
      font-weight: 700;
      font-size: 20px;
      background: linear-gradient(135deg, #c084fc 0%, #e879f9 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 4px;
    }

    .logout-btn {
      background: linear-gradient(135deg, #f43f5e 0%, #e11d48 100%);
      color: #fff;
      border: none;
      padding: 10px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      width: 100%;
      transition: all 0.22s;
      box-shadow: 0 4px 14px rgba(244, 63, 94, 0.3);
    }

    .logout-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 22px rgba(244, 63, 94, 0.45);
    }

    select {
      width: 100%;
      appearance: none;
      -webkit-appearance: none;
      cursor: pointer;
    }

    .upload-btn {
      background: linear-gradient(135deg, #a855f7 0%, #7c3aed 50%, #c026d3 100%);
      color: #fff;
      border: none;
      padding: 13px 28px;
      border-radius: 13px;
      font-weight: 700;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.25s;
      box-shadow: 0 5px 20px rgba(168, 85, 247, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      position: relative;
      overflow: hidden;
    }

    .upload-btn::after {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 60%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.4s;
    }

    .upload-btn:hover::after {
      left: 160%;
    }

    .upload-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(168, 85, 247, 0.55);
    }

    .form-label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: rgba(216, 180, 254, 0.7);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 8px;
    }
  </style>
</head>

<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">✨ RAG Assistant</div>
      <nav class="nav">
        <a href="chat.html">💬 Chat</a>
        <a href="upload.html" class="active">📤 Upload</a>
      </nav>

      <div style="margin-top:auto; padding-top:20px; border-top:1px solid rgba(168,85,247,0.15);">
        <button class="logout-btn" onclick="logout()">🚪 Logout</button>
      </div>
    </aside>

    <main class="panel">
      <div style="margin-bottom:28px;">
        <div class="panel-title">📚 Upload Documents</div>
        <p style="color:var(--muted); font-size:13px; margin:4px 0 0;">Add knowledge files to your RAG system</p>
      </div>

      <div class="upload-area" id="uploadArea" onclick="document.getElementById('file').click()">
        <div class="upload-icon">📥</div>
        <div style="font-weight:600; color:#c084fc; margin-bottom:6px; font-size:15px;">Drop your PDF here</div>
        <div style="color:var(--muted); font-size:13px;">or click to browse files</div>
        <div id="fileName" class="file-selected" style="display:none;"></div>
      </div>
      <input type="file" id="file" accept=".pdf" />

      <div style="margin-top:22px;">
        <label class="form-label">📋 Assign Role Category</label>
        <select id="role">
          <option value="HR">📊 HR — Human Resources</option>
          <option value="DEV">⚙️ DEV — Development</option>
          <option value="ADMIN">👑 ADMIN — Administration</option>
        </select>
      </div>

      <div style="display:flex; gap:12px; align-items:center; margin-top:22px;">
        <button class="upload-btn" onclick="upload()">🚀 Upload</button>
        <span id="msg" style="font-size:13px; color:var(--muted);"></span>
      </div>

      <div id="status" class="upload-status"></div>
    </main>
  </div>

  <script>
    const token = localStorage.getItem('token');
    if (!token) { alert('Please login first'); window.location.href = 'login.html'; }

    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('file');
    const fileNameEl = document.getElementById('fileName');

    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(ev => {
      uploadArea.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); });
    });
    ['dragenter', 'dragover'].forEach(ev => uploadArea.addEventListener(ev, () => uploadArea.classList.add('drag-over')));
    ['dragleave', 'drop'].forEach(ev => uploadArea.addEventListener(ev, () => uploadArea.classList.remove('drag-over')));

    uploadArea.addEventListener('drop', e => {
      fileInput.files = e.dataTransfer.files;
      updateFileName();
    });
    fileInput.addEventListener('change', updateFileName);

    function updateFileName() {
      if (fileInput.files.length > 0) {
        fileNameEl.innerText = '✓ ' + fileInput.files[0].name;
        fileNameEl.style.display = 'inline-block';
      } else {
        fileNameEl.style.display = 'none';
      }
    }

    function logout() {
      localStorage.removeItem('role');
      localStorage.removeItem('token');
      window.location.href = 'login.html';
    }

    async function upload() {
      const role = document.getElementById('role').value;
      const msgEl = document.getElementById('msg');
      const statusEl = document.getElementById('status');

      if (!fileInput.files.length) { msgEl.innerText = '⚠️ Choose a PDF file'; return; }

      msgEl.innerText = '⏳ Uploading…';
      statusEl.className = 'upload-status';
      statusEl.innerText = '';

      const fd = new FormData();
      fd.append('file', fileInput.files[0]);
      fd.append('role', role);

      try {
        const res = await fetch('http://127.0.0.1:8000/upload', {
          method: 'POST', body: fd,
          headers: { 'Authorization': 'Bearer ' + token }
        });

        if (res.status === 401) {
          alert('Session expired. Please login again.');
          logout();
          return;
        }

        const data = await res.json();
        msgEl.innerText = '';
        if (data.message) {
          statusEl.className = 'upload-status success';
          statusEl.innerText = '✅ ' + (data.message || 'Uploaded successfully!');
          fileInput.value = ''; updateFileName();
        } else {
          statusEl.className = 'upload-status error';
          statusEl.innerText = '❌ ' + (data.detail || 'Upload failed');
        }
      } catch (e) {
        msgEl.innerText = '';
        statusEl.className = 'upload-status error';
        statusEl.innerText = '❌ Error: ' + e.message;
      }
    }
  </script>
</body>

</html>
