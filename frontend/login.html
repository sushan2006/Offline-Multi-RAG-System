<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Login — RAG Assistant</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Sora:wght@600;700;800&display=swap"
        rel="stylesheet" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* ── BACKGROUND ─────────────────────────────── */
        body {
            background: linear-gradient(160deg, #1a0533 0%, #2d0a5c 25%, #4b1080 50%, #3a1260 75%, #1c0444 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* animated glowing orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            animation: drift 18s ease-in-out infinite;
        }

        .orb-1 {
            width: 480px;
            height: 480px;
            background: radial-gradient(circle, rgba(168, 85, 247, 0.45) 0%, transparent 70%);
            top: -120px;
            left: -100px;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 380px;
            height: 380px;
            background: radial-gradient(circle, rgba(236, 72, 153, 0.3) 0%, transparent 70%);
            bottom: -80px;
            right: -60px;
            animation-delay: -7s;
        }

        .orb-3 {
            width: 260px;
            height: 260px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.35) 0%, transparent 70%);
            top: 55%;
            left: 60%;
            animation-delay: -13s;
        }

        @keyframes drift {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            33% {
                transform: translate(40px, -50px) scale(1.08);
            }

            66% {
                transform: translate(-30px, 30px) scale(0.95);
            }
        }

        /* ── GLASS CARD ─────────────────────────────── */
        .card {
            position: relative;
            z-index: 10;
            width: 420px;
            padding: 48px 40px 40px;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(28px) saturate(180%);
            -webkit-backdrop-filter: blur(28px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow:
                0 32px 80px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.2),
                0 0 0 1px rgba(168, 85, 247, 0.15);
            animation: cardIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(32px) scale(0.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* glossy top shine */
        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 16px;
            right: 16px;
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.55), transparent);
            border-radius: 50%;
        }

        /* ── HEADER ─────────────────────────────────── */
        .logo-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
            border-radius: 18px;
            background: linear-gradient(135deg, #a855f7, #ec4899);
            box-shadow: 0 8px 30px rgba(168, 85, 247, 0.55);
            font-size: 28px;
            animation: pulse 3s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                box-shadow: 0 8px 30px rgba(168, 85, 247, 0.55);
            }

            50% {
                box-shadow: 0 8px 40px rgba(168, 85, 247, 0.85), 0 0 60px rgba(168, 85, 247, 0.25);
            }
        }

        .card-title {
            font-family: 'Sora', sans-serif;
            font-weight: 800;
            font-size: 30px;
            letter-spacing: -0.8px;
            text-align: center;
            background: linear-gradient(135deg, #e9d5ff 0%, #c084fc 50%, #f0abfc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 6px;
        }

        .card-sub {
            text-align: center;
            font-size: 13px;
            color: rgba(216, 180, 254, 0.65);
            margin-bottom: 36px;
            font-weight: 400;
            letter-spacing: 0.2px;
        }

        /* ── INPUTS ─────────────────────────────────── */
        .field {
            margin-bottom: 20px;
        }

        .field label {
            display: block;
            font-size: 11.5px;
            font-weight: 600;
            color: rgba(216, 180, 254, 0.75);
            text-transform: uppercase;
            letter-spacing: 0.8px;
            margin-bottom: 8px;
        }

        .input-wrap {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
            pointer-events: none;
            opacity: 0.65;
        }

        .field input {
            width: 100%;
            padding: 14px 16px 14px 42px;
            border-radius: 14px;
            border: 1px solid rgba(168, 85, 247, 0.25);
            background: rgba(255, 255, 255, 0.05);
            color: #f3e8ff;
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 400;
            outline: none;
            transition: all 0.25s ease;
            backdrop-filter: blur(8px);
        }

        .field input::placeholder {
            color: rgba(216, 180, 254, 0.35);
        }

        .field input:focus {
            border-color: rgba(168, 85, 247, 0.7);
            background: rgba(168, 85, 247, 0.1);
            box-shadow: 0 0 0 3px rgba(168, 85, 247, 0.18), 0 4px 20px rgba(168, 85, 247, 0.15);
            transform: translateY(-1px);
        }

        /* ── BUTTON ─────────────────────────────────── */
        .btn-login {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 15px;
            margin-top: 28px;
            border: none;
            border-radius: 14px;
            font-family: 'Sora', sans-serif;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.3px;
            cursor: pointer;
            background: linear-gradient(135deg, #a855f7 0%, #7c3aed 50%, #c026d3 100%);
            color: #fff;
            box-shadow: 0 6px 30px rgba(168, 85, 247, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transition: all 0.28s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        /* glossy sheen sweep */
        .btn-login::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 60%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.22), transparent);
            transition: left 0.45s ease;
            skewX: -10deg;
        }

        .btn-login:hover::after {
            left: 160%;
        }

        .btn-login:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 45px rgba(168, 85, 247, 0.65), inset 0 1px 0 rgba(255, 255, 255, 0.25);
        }

        .btn-login:active {
            transform: translateY(0);
            box-shadow: 0 4px 16px rgba(168, 85, 247, 0.4);
        }

        /* ── MESSAGE ────────────────────────────────── */
        #msg {
            min-height: 22px;
            margin-top: 14px;
            text-align: center;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.2px;
            transition: all 0.3s ease;
        }

        #msg.success {
            color: #86efac;
        }

        #msg.error {
            color: #f9a8d4;
        }

        /* ── FOOTER LINK ────────────────────────────── */
        .footer-link {
            text-align: center;
            margin-top: 22px;
            font-size: 13px;
            color: rgba(216, 180, 254, 0.5);
        }

        .footer-link a {
            color: #c084fc;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s;
            position: relative;
        }

        .footer-link a::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 0;
            height: 1px;
            background: #c084fc;
            transition: width 0.25s;
        }

        .footer-link a:hover {
            color: #e9d5ff;
        }

        .footer-link a:hover::after {
            width: 100%;
        }

        /* ── DIVIDER ────────────────────────────────── */
        .divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 8px 0 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(168, 85, 247, 0.2);
        }

        .divider span {
            font-size: 11px;
            color: rgba(216, 180, 254, 0.4);
            white-space: nowrap;
        }
    </style>
</head>

<body>

    <!-- background orbs -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="card">

        <div class="logo-wrap">🔐</div>
        <h1 class="card-title">Welcome Back</h1>
        <p class="card-sub">Sign in to your RAG Assistant</p>

        <div class="field">
            <label>Username</label>
            <div class="input-wrap">
                <span class="input-icon">👤</span>
                <input id="username" type="text" placeholder="Enter your username" autocomplete="username" />
            </div>
        </div>

        <div class="field">
            <label>Password</label>
            <div class="input-wrap">
                <span class="input-icon">🔑</span>
                <input id="password" type="password" placeholder="Enter your password"
                    autocomplete="current-password" />
            </div>
        </div>

        <button class="btn-login" id="loginBtn" onclick="login()">
            ✨ Sign In
        </button>

        <div id="msg"></div>

        <div class="footer-link">
            Don't have an account? <a href="signup.html">Create one now</a>
        </div>

    </div>

    <script>
        async function login() {
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const msg = document.getElementById('msg');
            const btn = document.getElementById('loginBtn');

            msg.className = '';
            msg.innerText = '';

            if (!username || !password) {
                msg.className = 'error';
                msg.innerText = '⚠️ Please enter your credentials';
                return;
            }

            btn.innerText = '⏳ Signing in…';
            btn.disabled = true;

            try {
                const res = await fetch('http://127.0.0.1:8000/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (data.access_token) {
                    localStorage.setItem('role', data.role);
                    localStorage.setItem('token', data.access_token);
                    msg.className = 'success';
                    msg.innerText = '✅ Login successful! Redirecting…';
                    setTimeout(() => location.href = 'chat.html', 600);
                } else {
                    msg.className = 'error';
                    msg.innerText = data.detail || '❌ Invalid credentials';
                    btn.innerText = '✨ Sign In';
                    btn.disabled = false;
                }
            } catch (e) {
                msg.className = 'error';
                msg.innerText = '❌ Error: ' + e.message;
                btn.innerText = '✨ Sign In';
                btn.disabled = false;
            }
        }

        document.getElementById('password').addEventListener('keydown', e => {
            if (e.key === 'Enter') login();
        });
        document.getElementById('username').addEventListener('keydown', e => {
            if (e.key === 'Enter') document.getElementById('password').focus();
        });
    </script>
</body>

</html>
